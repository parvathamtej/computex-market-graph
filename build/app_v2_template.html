<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComputeX Market Graph</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>__LEAFLET_CSS__</style>
<style>
:root{
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:999px;
  --dur:150ms; --ease:cubic-bezier(0,0,.2,1);
  --panel-w:384px;
  --font:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  /* dark is the primary theme for a map tool: pins read best on a dark ground */
  --bg:#0B0D10; --s1:#16191F; --s2:#1E2229; --s3:#262B33;
  --bd:rgba(255,255,255,.08); --bd2:rgba(255,255,255,.16);
  --t1:#ECEEF2; --t2:#A8B0BF; --t3:#8B93A3;
  --glass:rgba(22,25,31,.88); --glass-bd:rgba(255,255,255,.09);
  --sh:0 10px 30px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.4);
  /* six layer colours, validated for a dark ground and colour-vision deficiency */
  --c-site:#1F9C8B;  --c-site-t:#5FD3C2;
  --c-dem:#B8861B;   --c-dem-t:#F0C24B;
  --c-con:#CC3A84;   --c-con-t:#F27AB6;
  --c-cap:#8570D8;   --c-cap-t:#B4A5F0;
  --c-off:#CC5555;   --c-off-t:#F08A8A;
  --c-px:#3390CC;    --c-px-t:#75BDF0;
  --c-ctry:#6B7A8C;
  --acc:var(--c-con); --acct:var(--c-con-t);
  --good:#4CC08A; --warn:#E0A227;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F5F7; --s1:#FFFFFF; --s2:#EEF1F4; --s3:#E3E8ED;
  --bd:rgba(10,20,30,.10); --bd2:rgba(10,20,30,.20);
  --t1:#0F151B; --t2:#46525E; --t3:#6E7B88;
  --glass:rgba(255,255,255,.92); --glass-bd:rgba(10,20,30,.10);
  --sh:0 10px 30px rgba(20,30,40,.14), 0 1px 2px rgba(20,30,40,.10);
  --c-site:#0F7F71; --c-site-t:#0B6B5F; --c-dem:#9A6E0E; --c-dem-t:#7E5A0B;
  --c-con:#C22B78; --c-con-t:#A0205F; --c-cap:#6A55C9; --c-cap-t:#5442A6;
  --c-off:#C13F3F; --c-off-t:#A03030; --c-px:#2076B0; --c-px-t:#185E8E; --c-ctry:#7A8896;
  --good:#1E7F55; --warn:#9A6E0E; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:13.5px;line-height:1.45;
     -webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
a{color:var(--acct);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--acct);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- map ---------- */
#map{position:fixed;inset:0;background:var(--bg);z-index:0}
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-control-attribution{background:var(--glass)!important;color:var(--t3)!important;font-size:10px;
  border-top-left-radius:6px}
.leaflet-control-attribution a{color:var(--t2)!important}
.leaflet-tooltip{background:var(--glass);color:var(--t1);border:1px solid var(--glass-bd);border-radius:var(--r-sm);
  box-shadow:var(--sh);font-family:var(--font);font-size:12px;padding:6px 9px;line-height:1.35;backdrop-filter:blur(10px)}
.leaflet-tooltip::before{display:none}
.leaflet-tooltip b{font-weight:600}
.leaflet-tooltip .tt-sub{color:var(--t3);font-size:11px;margin-top:2px}
.leaflet-tooltip .tt-k{font-family:var(--mono);font-size:11px;color:var(--t2)}
.leaflet-tooltip.tt-wide{max-width:360px;white-space:normal}
.tt-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin:7px 0 2px}
.tt-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:2px 0;border-top:1px solid var(--bd)}
.tt-row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-row .tt-k{flex:none}
.tt-src{display:block;font-family:var(--mono);font-size:10px;color:var(--t3);margin-top:3px}
.ctryhandle{cursor:pointer}.ctryhandle:hover{color:var(--acct)}
/* in-map popup card */
.cxpop .leaflet-popup-content-wrapper{background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(14px);border-radius:var(--r-lg);box-shadow:var(--sh);padding:0}
.cxpop .leaflet-popup-content{margin:0;width:auto!important}
.cxpop .ppwrap{overflow:auto;resize:both;min-width:300px;min-height:180px;max-width:88vw;max-height:82vh;
  width:var(--pp-w,404px);height:var(--pp-h,440px)}
.cxpop .ppwrap::-webkit-resizer{background:transparent}
.pp .lnk{background:none;border:0;color:var(--acct);cursor:pointer;font:inherit;font-size:10.5px;padding:2px 0;text-decoration:underline}
.pp .lnk:hover{color:var(--t1)}
.cxpop .ppgrip{position:absolute;right:2px;bottom:2px;width:14px;height:14px;pointer-events:none;opacity:.5;
  background:linear-gradient(135deg,transparent 46%,var(--t3) 46%,var(--t3) 56%,transparent 56%,transparent 72%,var(--t3) 72%,var(--t3) 82%,transparent 82%)}
.cxpop .leaflet-popup-tip{background:var(--glass)}
.cxpop .leaflet-popup-close-button{color:var(--t3);font-size:18px;padding:6px 8px 0 0}
.pp{padding:14px 16px 12px;font-family:var(--font);font-size:12.5px;color:var(--t1)}
.pp-kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
.pp h3{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.pp-sub{color:var(--t3);font-size:11.5px;margin-bottom:8px}
.pp-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.pp-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0 4px}
.pp-kpis div{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-sm);padding:7px 8px}
.pp-kpis b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.pp-kpis small{color:var(--t3);font-size:10.5px}
.pp-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin:12px 0 4px}
.prow2{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--bd)}
.prow2 .pr-l{flex:1;min-width:0}.prow2 .pr-l b{font-weight:600}
.prow2 .pr-l small{display:block;color:var(--t3);font-size:11px;line-height:1.35;margin-top:1px}
.prow2 .pr-v{font-family:var(--mono);font-size:11.5px;color:var(--t2);white-space:nowrap;flex:none}
.pr-src{font-size:10.5px;margin-top:2px}
.pr-what{color:var(--t2)}
.tag.dem{color:var(--c-dem-t);border-color:var(--c-dem)}
.pp-none{color:var(--t3);font-size:11.5px;padding:4px 0}
.pp-src{margin-top:10px;font-size:11px;color:var(--t3)}
.pr-btns{display:flex;gap:6px;margin-top:12px}.pr-btns .btn{padding:7px 10px;font-size:12px}
a.src{font-family:var(--mono);font-size:10.5px;color:var(--acct)}
.when{font-family:var(--mono);font-size:10px;color:var(--t3)}
.mini .mn small a.src{font-size:10px}
.cl{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;
    font-size:11px;text-align:center;line-height:1.1;border:2px solid rgba(255,255,255,.7);
    box-shadow:0 2px 10px rgba(0,0,0,.4);font-family:var(--font)}
.pxlabel{background:var(--glass);border:1px solid var(--c-px);color:var(--t1);border-radius:var(--r-sm);
  padding:3px 7px;font-family:var(--mono);font-size:11px;white-space:nowrap;box-shadow:var(--sh)}
.pxlabel b{color:var(--c-px-t);font-weight:600}
.ctrylabel{background:none;border:0;box-shadow:none;color:var(--t1);font-weight:600;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.ctrylabel small{display:block;font-weight:400;color:var(--t2);font-family:var(--mono);font-size:10px}
/* one country chip: the name never carries colour, the number always does */
.ctrychip{display:inline-flex;align-items:baseline;gap:6px;transform:translate(-50%,-50%);white-space:nowrap;
  background:var(--glass);border:1px solid var(--bd);border-radius:var(--r-full);padding:3px 9px;
  backdrop-filter:blur(8px);box-shadow:0 1px 6px rgba(0,0,0,.3);cursor:pointer;font-size:11.5px}
.ctrychip:hover{border-color:var(--acc)}
.ctrychip .cn{font-weight:600;color:var(--t1)}
.ctrychip .cv{font-family:var(--mono);font-size:10.5px;font-weight:600}
.ctrychip .cv em{font-style:normal;font-weight:400;opacity:.7;margin-left:2px;font-size:9px}
.ctrychip .cvsep{color:var(--t3);opacity:.5;margin:0 1px}
.ctrychip .cv.none{color:var(--t3);font-weight:400}

/* ---------- glass chrome ---------- */
.glass{background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(14px);
       -webkit-backdrop-filter:blur(14px);box-shadow:var(--sh)}
#topleft{position:fixed;top:14px;left:14px;z-index:1100;width:min(440px,calc(100vw - var(--panel-w) - 44px));
  display:flex;flex-direction:column;gap:8px}
#search{position:relative}
#search input{width:100%;padding:11px 40px 11px 40px;border-radius:var(--r-lg);background:var(--glass);
  border:1px solid var(--glass-bd);font-size:14px;color:var(--t1);box-shadow:var(--sh);backdrop-filter:blur(14px)}
#search input::placeholder{color:var(--t3)}
#search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
#search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;
  color:var(--t3);padding:6px;border-radius:var(--r-sm);display:none}
#search .clr:hover{color:var(--t1);background:var(--s3)}
#results{border-radius:var(--r-md);overflow:hidden;max-height:min(360px,60vh);overflow-y:auto;display:none}
#results.on{display:block}
.res{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--bd)}
.res:last-child{border-bottom:0}
.res:hover,.res[aria-selected="true"]{background:var(--s2)}
.res .rn{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rt{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);flex:none}
.sw{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:var(--r-full);
  cursor:pointer;font-size:12.5px;font-weight:500;color:var(--t2);transition:all var(--dur) var(--ease)}
.chipb[aria-pressed="true"]{color:var(--t1);border-color:var(--bd2)}
.chipb[aria-pressed="false"] .sw{opacity:.3}
.chipb[aria-pressed="false"]{opacity:.7}
.chipb:hover{color:var(--t1)}
.chipb .n{font-family:var(--mono);font-size:10.5px;color:var(--t3)}

/* ---------- right panel ---------- */
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);z-index:1100;display:flex;flex-direction:column;
  background:var(--s1);border-left:1px solid var(--bd);transition:transform var(--dur) var(--ease)}
#panel.closed{transform:translateX(100%)}
#panel-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:1101;width:22px;height:64px;
  border-radius:var(--r-md) 0 0 var(--r-md);border:1px solid var(--bd);border-right:0;background:var(--glass);
  cursor:pointer;color:var(--t2);display:none;align-items:center;justify-content:center}
#panel.closed ~ #panel-tab{display:flex}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.ib{width:32px;height:32px;border-radius:var(--r-md);border:1px solid var(--bd);background:var(--s2);cursor:pointer;
    color:var(--t2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:var(--s3);color:var(--t1)}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.pbody::-webkit-scrollbar{width:8px}.pbody::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}

/* selection card */
#sel{margin:12px 12px 4px;border-radius:var(--r-lg);background:var(--s2);border:1px solid var(--bd2);overflow:hidden}
#sel[hidden]{display:none}
.selh{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 10px}
.selh .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;font-weight:500}
.selh h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.selh .sub{color:var(--t3);font-size:12px;margin-top:3px}
.selh .x{margin-left:auto}
.selb{padding:0 14px 14px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 12px;font-size:12.5px;margin:8px 0 12px}
.kv dt{color:var(--t3);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;color:var(--t1)}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;
     text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--bd2);color:var(--t2);white-space:nowrap}
.tag.site{color:var(--c-site-t);border-color:var(--c-site)} .tag.dem{color:var(--c-dem-t);border-color:var(--c-dem)}
.tag.con{color:var(--c-con-t);border-color:var(--c-con)}   .tag.cap{color:var(--c-cap-t);border-color:var(--c-cap)}
.tag.off{color:var(--c-off-t);border-color:var(--c-off)}   .tag.good{color:var(--good);border-color:var(--good)}
.cf{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:3px;white-space:nowrap}
.cf1{background:rgba(76,192,138,.15);color:var(--good);border:1px solid var(--good)}
.cf2{background:var(--s3);color:var(--t1);border:1px solid var(--bd2)}
.cf3{color:var(--t2);border:1px solid var(--bd2)}
.cf4{color:var(--t3);border:1px dashed var(--bd2)}
.cf5{color:var(--t3);border:1px dotted var(--bd2);font-style:italic}
.approx{background:rgba(224,162,39,.12);border-left:3px solid var(--warn);padding:8px 10px;font-size:12px;
        color:var(--t2);border-radius:0 var(--r-sm) var(--r-sm) 0;margin:8px 0}
.mini{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--bd);font-size:12.5px}
.mini:first-of-type{border-top:0}
.mini .mn{flex:1;min-width:0;color:var(--t1)}
.mini .mn small{display:block;color:var(--t3);font-size:11.5px;line-height:1.35;margin-top:1px}
.mini .mv{font-family:var(--mono);font-size:11.5px;color:var(--t2);white-space:nowrap}
.mini.click{cursor:pointer}.mini.click:hover .mn{color:var(--acct)}
.subh{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);
      margin:14px 0 6px;font-weight:500}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:8px 10px;border-radius:var(--r-md);border:1px solid var(--bd2);background:var(--s3);cursor:pointer;
     font-size:12.5px;font-weight:500;color:var(--t1);text-align:center}
.btn:hover{border-color:var(--acct)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.srcs{margin:0;padding:0;list-style:none}
.srcs li{font-size:11.5px;padding:4px 0;word-break:break-all;line-height:1.35}
.dash{color:var(--t3)}

/* sections */
details.sec{border-top:1px solid var(--bd)}
details.sec summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.01em;flex:1}
details.sec summary .ssum{font-family:var(--mono);font-size:10.5px;color:var(--t3)}
details.sec summary .chev{transition:transform var(--dur)}
details.sec[open] summary .chev{transform:rotate(180deg)}
.secb{padding:2px 16px 16px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:10px 11px}
.kpi .v{font-size:20px;font-weight:700;letter-spacing:-.025em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.3}
.kpi .s{font-size:10px;color:var(--t3);margin-top:3px;line-height:1.3;opacity:.8}
.kpi.dim .v{color:var(--t3)}
.mstrip{display:flex;flex-wrap:wrap;gap:4px 14px;margin:9px 0 0;font-size:11px;color:var(--t3);font-family:var(--mono)}
.mstrip b{color:var(--t2);font-weight:600}
.scope{display:inline-flex;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-full);padding:2px;gap:2px}
.scope button{background:none;border:0;border-radius:var(--r-full);padding:3px 10px;cursor:pointer;font-size:10.5px;
  font-family:var(--mono);color:var(--t3);font-weight:500}
.scope button[aria-pressed="true"]{background:var(--s3);color:var(--t1)}
.lgrule{display:flex;gap:10px;align-items:center;font-size:10.5px;color:var(--t3);margin:2px 0 8px;flex-wrap:wrap}
.lgrule span{display:inline-flex;align-items:center;gap:4px}
.lgrule i{width:8px;height:8px;border-radius:2px;display:block}
.lgscale{display:flex;align-items:center;gap:8px;margin:8px 0 0;padding-top:8px;border-top:1px solid var(--bd)}
.lgscale label{font-size:11px;color:var(--t3);flex:none}
.lgscale input{flex:1;min-width:0;accent-color:var(--acc)}
.lgscale .v{font-family:var(--mono);font-size:10px;color:var(--t3);flex:none;min-width:32px;text-align:right}
.kpi.live .v{color:var(--good)} .kpi.build .v{color:var(--c-site-t)} .kpi.dem .v{color:var(--c-dem-t)}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}
.lrow:last-child{border-bottom:0}
.lrow .sw{width:12px;height:12px}
.lrow .lname{flex:1;font-weight:500;font-size:13px}
.lrow .ln{font-family:var(--mono);font-size:10.5px;color:var(--t3)}
.lrow.off .lname{color:var(--t3)}.lrow.off .sw{opacity:.3}
.eye{width:28px;height:28px;border-radius:var(--r-sm);border:0;background:none;cursor:pointer;color:var(--t2);
     display:inline-flex;align-items:center;justify-content:center}
.eye:hover{background:var(--s3);color:var(--t1)}
.eye[aria-pressed="false"]{color:var(--t3)}
.seg{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r-md);padding:2px;gap:2px;margin:6px 0 4px 22px}
.seg button{flex:1;background:none;border:0;border-radius:6px;padding:5px 6px;cursor:pointer;font-size:11.5px;
            color:var(--t3);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--t1)}
.fgrp{margin:0 0 9px 5px;padding:2px 0 2px 16px;border-left:2px solid var(--bd2)}

<script>
"use strict";
/* ============ data ============ */
const DATA = JSON.parse(document.getElementById("dataset").textContent);
const DEALS = DATA.deals.filter(d => !d.is_restatement), ALLDEALS = DATA.deals, SITES = DATA.sites;
const ENT = {}; DATA.entities.forEach(e => ENT[e.entity_id] = e);
const PRICES = DATA.prices, COV = DATA.coverage, CAP = DATA.apac_capacity || [];
const CTRY = DATA.country_summary || []; const CT = {}; CTRY.forEach(c => CT[c.country] = c);
const CAPROW = {}; CAP.forEach(c => CAPROW[c.country] = c);
const APAC_TOTAL = CAPROW["APAC total"] || null;
const bld = c => (c.official_uc_mw != null ? c.official_uc_mw : c.building_mw) || 0;
const DEAL = {}; DATA.deals.forEach(d => DEAL[d.deal_id] = d);
const SITE = {}; SITES.forEach(s => SITE[s.site_id] = s);
const bucketOf = s => s === "live" ? "live" : (s === "under_construction" || s === "phased") ? "building" : "planned";
const host = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return u; } };
/* one source line for any record: "reuters.com ↗ · 12 Aug 2026" (link) or plain text for tooltips */
const srcA = (r, plain) => { const u = (r.source_urls||[])[0]; if (!u) return ""; const when = r.announced_date || r.commissioned || r.captured_at || "";
  return plain ? `<span class="tt-src">${esc(host(u))}${when?" · "+esc(when):""}</span>`
               : `<a class="src" href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">${esc(host(u))} ↗</a>${when?`<span class="when"> · ${esc(when)}</span>`:""}`; };
const whoName = id => { const e = ENT[id]; return !e || e.is_placeholder ? "Undisclosed" : e.name; };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NF = new Intl.NumberFormat("en-US");
const nf = n => n == null ? "—" : NF.format(Math.round(n));
const nf1 = n => n == null ? "—" : Number(n).toLocaleString("en-US",{maximumFractionDigits:1});
const mwf = n => n == null ? "—" : (Math.abs(n) < 100 ? nf1(n) : nf(n)) + " MW";
const kf = n => n == null ? "—" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(n>=1e4?0:1)+"k" : nf(n);
const usd = v => v == null ? "—" : v >= 1e9 ? "$"+(v/1e9).toLocaleString("en-US",{maximumFractionDigits:1})+"bn"
  : v >= 1e6 ? "$"+(v/1e6).toLocaleString("en-US",{maximumFractionDigits:0})+"m" : "$"+nf(v);
const ename = id => (ENT[id] && ENT[id].name) || "—";
const dash = '<span class="dash">—</span>';

const DT = {D1:"Compute contract",D2:"Chip purchase",D3:"Chip rental",D4:"Building lease",D5:"Power deal",
  D6:"New data centre",D7:"Stated need",D8:"Borrowing",D9:"Investment",D10:"Guarantee",D11:"Swap or barter",
  D12:"Marketplace trade",D13:"Futures and hedges",D14:"Second-hand sale",D15:"Someone offloading",
  D16:"Partnership",D17:"Rule change"};
const CONF = {T1:"Regulatory filing",T2:"Company announcement",T3:"Named journalist, credible outlet",T4:"Rumour or analyst estimate",T5:"Our own inference"};
const cf = c => c ? `<span class="cf cf${c.slice(1)}" title="${esc(CONF[c]||"")}">${esc(c)}</span>` : dash;
const APAC = new Set(["Singapore","Malaysia","Indonesia","India","Japan","South Korea","Taiwan","Thailand","Vietnam","Philippines","Australia","New Zealand","Hong Kong","China","Macau"]);

/* company location: HQ if we have it, else null */
const locOf = id => { const e = ENT[id]; return e && e.hq_lat != null ? [e.hq_lat, e.hq_lng] : null; };
/* deal geometry: the provider end prefers a named site if we can find one */
const siteByName = {}; SITES.forEach(s => { if (s.name) siteByName[s.name.toLowerCase()] = s; });
function dealEnds(d){
  let a = locOf(d.from_id), b = locOf(d.to_id);
  if (d.site) { const s = siteByName[String(d.site).toLowerCase()]; if (s && s.lat != null) a = [s.lat, s.lng]; }
  return a && b && (a[0] !== b[0] || a[1] !== b[1]) ? [a, b] : null;
}
/* demand records: one per company with a stated-need gap */
const GAPS = DATA.demand_gaps.map(g => ({...g, loc: locOf(g.entity_id)}));
const OFFLOADS = DEALS.filter(d => d.deal_type === "D15").map(d => ({...d, loc: locOf(d.from_id) || locOf(d.to_id)}));
const CONTRACTS = DEALS.filter(d => d.deal_type === "D1").map(d => ({...d, ends: dealEnds(d)}));
const CAPITAL = DEALS.filter(d => ["D8","D9","D10"].includes(d.deal_type)).map(d => ({...d, ends: dealEnds(d)}));
/* every demand-side company: anyone who stated a need (D7) or bought compute (D1) */
const DEMAND = (() => {
  const m = {};
  DEALS.forEach(d => {
    if (!["D7","D1"].includes(d.deal_type) || !d.to_id || (ENT[d.to_id]||{}).is_placeholder) return;
    const r = m[d.to_id] = m[d.to_id] || {entity_id:d.to_id, name:ename(d.to_id), needs:[], contracts:[], stated_mw:0, contracted_mw:0, stated_usd:0, loc:locOf(d.to_id)};
    if (d.deal_type==="D7") { r.needs.push(d); r.stated_mw += d.mw||0; r.stated_usd += d.usd_value||0; }
    else { r.contracts.push(d); r.contracted_mw += d.mw||0; }
  });
  Object.values(m).forEach(r => { r.needs.sort((a,b)=>(b.announced_date||"").localeCompare(a.announced_date||"")); r.contracts.sort((a,b)=>(b.usd_value||b.mw||0)-(a.usd_value||a.mw||0));
    r.size_mw = Math.max(r.stated_mw, r.contracted_mw); r.latest = r.needs[0] || r.contracts[0]; });
  return Object.values(m).sort((a,b)=>b.size_mw-a.size_mw);
})();
const YEAR = s => { const m = /20(\d\d)/.exec(String(s||"")); return m ? 2000 + +m[1] : null; };
function dStatus(d){
  if (d.deal_type==="D7") { const y = YEAR(d.by_when); return (y && y > 2028) ? "plan" : "stated"; }
  if (d.deal_type==="D1") return d.status==="operational" ? "running" : ["cancelled","resized","expired"].includes(d.status) ? "changed" : "signed";
  return "other";
}
const DSTAT = {stated:"stated need", plan:"long-range plan", signed:"signed, waiting", running:"running", changed:"changed", other:""};
const HYPER = /microsoft|google|alphabet|amazon|aws|meta platforms|oracle|alibaba|tencent|bytedance|apple inc/i;

/* ============ hash state ============ */
function readHash(){
  const h = location.hash.replace(/^#/, ""); if (!h) return;
  for (const kv of h.split("&")) {
    const i = kv.indexOf("="); if (i < 0) continue;
    const k = kv.slice(0,i), v = decodeURIComponent(kv.slice(i+1));
    if (k === "off") v.split(",").filter(Boolean).forEach(id => { if (id in S.on) S.on[id] = false; });
    if (k === "on")  v.split(",").filter(Boolean).forEach(id => { if (id in S.on) S.on[id] = true; });
    if (k === "status") S.siteStatus = v;
    if (k === "dstatus") S.demStatus = v;
    if (k === "dwho") S.demWho = v;
    if (k === "cstatus") S.conStatus = v;
    if (k === "cmetric") S.ctryMetric = v;
    if (k === "scope") S.scope = v;
    if (k === "tab") S.tab = v;
    if (k === "base") S.base = v;
    if (k === "theme") S.theme = v;
    if (k === "sel") S.sel = v;
    if (k === "q") S.q = v;
  }
}
function writeHash(){
  const off = LAYERS.filter(l => l.on && !S.on[l.id]).map(l => l.id);
  const on  = LAYERS.filter(l => !l.on && S.on[l.id]).map(l => l.id);
  const p = ["v=2"];
  if (off.length) p.push("off=" + off.join(","));
  if (on.length)  p.push("on=" + on.join(","));
  if (S.siteStatus !== "all") p.push("status=" + S.siteStatus);
  if (S.demStatus !== "all") p.push("dstatus=" + S.demStatus);
  if (S.demWho !== "all") p.push("dwho=" + S.demWho);
  if (S.conStatus !== "all") p.push("cstatus=" + S.conStatus);
  if (S.ctryMetric !== "building") p.push("cmetric=" + S.ctryMetric);
  if (S.scope !== "apac") p.push("scope=" + S.scope);
  if (S.tab !== "map") p.push("tab=" + S.tab);
  if (S.base !== "dark") p.push("base=" + S.base);
  if (S.theme !== "dark") p.push("theme=" + S.theme);
  if (S.sel) p.push("sel=" + encodeURIComponent(S.sel));
  if (S.q) p.push("q=" + encodeURIComponent(S.q));
  history.replaceState(null, "", "#" + p.join("&"));
}

/* curved line between two points: a shallow arc so overlapping routes stay readable */
function arcPts(a, b, bend){
  const [y1,x1] = a, [y2,x2] = b, n = 28, pts = [];
  const mx = (x1+x2)/2, my = (y1+y2)/2, dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy) || 1, k = (bend == null ? .18 : bend) * len;
  const cx = mx - dy/len*k, cy = my + dx/len*k;
  for (let i=0;i<=n;i++){ const t=i/n, u=1-t;
    pts.push([u*u*y1 + 2*u*t*cy + t*t*y2, u*u*x1 + 2*u*t*cx + t*t*x2]); }
  return pts;
}

/* One number per country, never three. The name is always neutral; the number always carries
   the colour of what it measures -- teal for supply, amber for demand -- so the map has one
   rule to learn. Labels are placed largest-first and any that would collide is dropped. */
const cRun = c => (c.official_live_mw ?? c.live_mw) || 0;
const cBld = c => c._mw != null ? c._mw : bld(c);
const cDem = c => c.demand_near_mw || 0;
const CMETRIC = {
  all:      {label:"Everything",   col:"--c-site-t", get:c => cRun(c) + cBld(c) + cDem(c)},
  building: {label:"Being built",  col:"--c-site-t", get:c => cBld(c)},
  running:  {label:"Running now",  col:"--c-site-t", get:c => cRun(c)},
  demand:   {label:"Demand",       col:"--c-dem-t",  get:c => cDem(c)}
};
/* In "Everything" mode a chip carries up to three figures. Colour still means one thing --
   teal is supply, amber is demand -- and the running / being-built split is carried by the
   word after the number, never by a second shade. */
function chipValue(c){
  if (S.ctryMetric !== "all")
    return `<span class="cv" style="color:var(${CMETRIC[S.ctryMetric].col})">${mwf(CMETRIC[S.ctryMetric].get(c))}</span>`;
  const bits = [];
  if (cRun(c)) bits.push(`<span class="cv" style="color:var(--c-site-t)">${mwf(cRun(c))}<em>on</em></span>`);
  if (cBld(c)) bits.push(`<span class="cv" style="color:var(--c-site-t)">${mwf(cBld(c))}<em>building</em></span>`);
  if (cDem(c)) bits.push(`<span class="cv" style="color:var(--c-dem-t)">${mwf(cDem(c))}<em>demand</em></span>`);
  return bits.join('<span class="cvsep">·</span>');
}
let CTRYLAB = null, REMAINDER = null;
function rebuildCountryLabels(){
  if (CTRYLAB) { map.removeLayer(CTRYLAB); CTRYLAB = null; }
  if (!S.on.country) return;
  const m = CMETRIC[S.ctryMetric] || CMETRIC.building;
  const b = map.getBounds(), placed = [];
  CTRYLAB = L.layerGroup();
  const sz = map.getSize();
  const blocked = (x, y) => (x < 580 && y < 240)                                  // search + chips
      || (S.legendOpen && x < 360 && y > sz.y - 300)                              // the key
      || (x > sz.x - 90);                                                          // map buttons
  const extra = (REMAINDER && S.ctryMetric === "building") ? [REMAINDER] : [];
  const rows = CTRY.concat(extra).filter(c => c.lat != null && b.contains([c.lat, c.lng]))
                   .sort((x,y) => (y._pri||0) - (x._pri||0) || m.get(y) - m.get(x));
  for (const c of rows) {
    if (placed.length >= (S.ctryMetric === "all" ? 11 : 16)) break;
    const v = m.get(c);
    if (!v) continue;
    const pt = map.latLngToContainerPoint([c.lat, c.lng]);
    const y  = pt.y - (c._r || 14) - 14;                       // sit above the ring
    const nv = S.ctryMetric === "all" ? [cRun(c), cBld(c), cDem(c)].filter(Boolean).length : 1;
    const w  = c.country.length * 6.6 + 20 + nv * 62;           // estimated chip width
    if (blocked(pt.x, y)) continue;
    if (placed.some(q => Math.abs(q.x - pt.x) < (q.w + w)/2 + 4 && Math.abs(q.y - y) < 22)) continue;
    placed.push({x:pt.x, y, w});
    const val = chipValue(c);
    const mk = L.marker([c.lat, c.lng], {pane:"markerPane", interactive:true, icon:L.divIcon({

function miniDeal(d, me){
  const other = me ? (d.from_id===me ? d.to_id : d.from_id) : null;
  let dir = me ? (d.from_id===me ? "to " : "from ") : "";
  if (me && d.deal_type==="D7" && !d.from_id) dir = "stated publicly";
  const who = dir==="stated publicly" ? "" : `<b>${esc(other?ename(other):ename(d.from_id)+" → "+ename(d.to_id))}</b>`;
  return `<div class="mini click" data-sel="deal:${esc(d.deal_id)}"><span class="mn">${dir}${who}<small>${esc(d.need_plain||d.headline)}</small><small>${srcA(d)}</small></span>
    <span class="mv">${d.usd_value!=null?usd(d.usd_value):(d.mw?mwf(d.mw):"")}</span>${cf(d.confidence)}</div>`;
}
function srcs(urls){
  if (!urls || !urls.length) return '<p class="hint" style="margin:0">No source recorded.</p>';
  return `<ul class="srcs">${urls.slice(0,6).map(u=>{ let h=u; try{h=new URL(u).hostname.replace(/^www\./,"");}catch(e){}
    return `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(h)} ↗</a> <span class="dash">${esc(u.slice(0,70))}${u.length>70?"…":""}</span></li>`;}).join("")}</ul>`;
}

function drawDeals(eid){

function drawLoop(i){
  const l = DATA.circular_loops[i]; if (!l) return;
  clearHi(); const ids=[l.a,l.b,l.c].filter(Boolean); const g = L.layerGroup();
  ids.forEach((a,k) => { const b = ids[(k+1)%ids.length]; const pa=locOf(a), pb=locOf(b); if(!pa||!pb) return;
    g.addLayer(L.polyline(arcPts(pa,pb,.22),{pane:"hi",color:"#fff",weight:7,opacity:.55,interactive:false}));
    g.addLayer(L.polyline(arcPts(pa,pb,.22),{pane:"hi",color:cssv("--c-cap-t"),weight:3.5,opacity:1}));
    g.addLayer(L.circleMarker(pa,{pane:"hi",radius:8,color:"#fff",weight:2,fillColor:cssv("--c-cap"),fillOpacity:1}).bindTooltip(`<b>${esc(ename(a))}</b>`,{permanent:true,direction:"top",offset:[0,-8],className:"ctrylabel",interactive:false})); });
  HI = g.addTo(map);
  try { const b = g.getBounds(); if (b.isValid()) map.flyToBounds(b.pad(.3),{duration:.6,maxZoom:5}); } catch(err){}
  const missing = ids.filter(a=>!locOf(a)).map(ename);
  $("sel").hidden=false; $("sel").innerHTML = card("Money loop","cap", ids.map(ename).join(" → ")+" → "+ename(ids[0]), "capital out, capacity back", `
    ${ids.map((a,k)=>{ const b=ids[(k+1)%ids.length]; const d=DEALS.find(x=>(x.from_id===a&&x.to_id===b)||(x.from_id===b&&x.to_id===a)); return d?miniDeal(d):""; }).join("")}
    ${missing.length?`<div class="approx">${esc(missing.join(", "))} has no headquarters pin, so that leg is not drawn.</div>`:""}
    <p class="hint">Nobody labelled this. It falls out of the deal list by following money out and payment back.</p>`);

}

const INDEX = [
  ...DATA.entities.filter(e=>!e.is_placeholder&&e.deal_count>0).map(e=>({t:DEM[e.entity_id]?"demand":"company",n:e.name,a:(e.aliases||[]).join(" "),id:"ent:"+e.entity_id,c:DEM[e.entity_id]?"--c-dem":"--c-con"})),
  ...SITES.map(s=>({t:"site",n:s.name,a:[s.operator,s.city,s.country].filter(Boolean).join(" "),id:"site:"+s.site_id,c:"--c-site"})),
  ...DEALS.map(d=>({t:"deal",n:d.headline,a:ename(d.from_id)+" "+ename(d.to_id),id:"deal:"+d.deal_id,c:["D8","D9","D10"].includes(d.deal_type)?"--c-cap":"--c-con"})),
  ...CTRY.filter(c=>c.country!=="APAC total").map(c=>({t:"country",n:c.country,a:"",id:"country:"+c.country,c:"--c-ctry"}))
];
function search(q){
  const r = $("results"); q = q.trim().toLowerCase();
  $("q-clear").style.display = q ? "block" : "none";
  if (!q) { r.classList.remove("on"); r.innerHTML=""; return; }
  const words = q.split(/\s+/);
  const hits = INDEX.map(x=>{ const hay=(x.n+" "+x.a).toLowerCase(); let sc=0; for (const w of words){ if(!hay.includes(w)) return null; sc += x.n.toLowerCase().startsWith(w)?3:x.n.toLowerCase().includes(w)?2:1; } return {x,sc}; })
    .filter(Boolean).sort((a,b)=>b.sc-a.sc || a.x.n.length-b.x.n.length).slice(0,12);
  r.innerHTML = hits.length ? hits.map((h,i)=>`<div class="res" role="option" data-sel="${esc(h.x.id)}" aria-selected="${i===0}"><span class="sw" style="background:var(${h.x.c})"></span><span class="rn">${esc(h.x.n)}</span><span class="rt">${esc(h.x.t)}</span></div>`).join("")
    : `<div class="res"><span class="rn" style="color:var(--t3)">Nothing matches “${esc(q)}”</span></div>`;
  r.classList.add("on");
}

  renderLayers(); renderLegend(); renderPill(); writeHash();
});
let qt=null; $("q").addEventListener("input", e => { clearTimeout(qt); qt=setTimeout(()=>{ S.q=e.target.value; search(S.q); writeHash(); },120); });
$("q").addEventListener("keydown", e => {
  const items=[...document.querySelectorAll("#results .res[data-sel]")]; let i=items.findIndex(x=>x.getAttribute("aria-selected")==="true");
  if (e.key==="ArrowDown"){ e.preventDefault(); i=Math.min(items.length-1,i+1); items.forEach((x,k)=>x.setAttribute("aria-selected",k===i)); }
  if (e.key==="ArrowUp"){ e.preventDefault(); i=Math.max(0,i-1); items.forEach((x,k)=>x.setAttribute("aria-selected",k===i)); }
  if (e.key==="Enter" && items[i]) { select(items[i].dataset.sel); $("results").classList.remove("on"); }
  if (e.key==="Escape") { $("results").classList.remove("on"); e.target.blur(); }
});
document.addEventListener("keydown", e => {
  if (e.target.tagName==="INPUT") return;
  if (e.key==="Escape") { if (S.present) setPresent(false); else if (S.sel) closeSel(); }
  if (e.key==="/") { e.preventDefault(); $("q").focus(); }
  if (e.key.toLowerCase()==="p") setPresent(!S.present);
  if (e.key.toLowerCase()==="h") fitApac();
});
map.on("zoomend", () => { Object.values(MK.sites).forEach(m => m.setRadius(siteRadius(m.options.mw, map.getZoom()))); });
map.on("moveend", () => { rebuildArcLabels(); rebuildCountryLabels(); });
function fitApac(){ const pts = SITES.filter(s=>s.lat!=null&&APAC.has(s.country)).map(s=>[s.lat,s.lng]); if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(.08)); else map.setView([8,105],3); }
function fitAll(){ const pts = SITES.filter(s=>s.lat!=null).map(s=>[s.lat,s.lng]); if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(.05)); }

/* ============ init ============ */
(function init(){
  try { const th=localStorage.getItem("cx.theme"); if (th) S.theme=th; const sc=parseFloat(localStorage.getItem("cx.scale")); if (sc>0) S.scale=sc; } catch(e){}
  readHash();
  document.documentElement.dataset.theme = S.theme;
  if (S.theme==="light" && S.base==="dark") S.base="light";
  setBase(S.base);
  fitApac();
  rebuildAll();
  renderAllPanels();
  if (S.q) { $("q").value=S.q; }
  if (S.sel) { if (S.sel.startsWith("loop:")) drawLoop(+S.sel.slice(5)); else select(S.sel,{noFly:false}); }
  setTab(S.tab);
  console.log("ComputeX map ready:", COV.deals_total, "deals,", SITES.filter(s=>s.lat!=null).length, "sites placed,", GAPS.filter(g=>g.loc).length, "demand pins,", CONTRACTS.filter(d=>d.ends).length, "contract arcs");
})();
</script>
